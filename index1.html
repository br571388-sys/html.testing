<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIP to Tree Image Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip library ZIP read karne ke liye -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex flex-col items-center p-8 font-sans">

    <div class="glass w-full max-w-2xl p-8 rounded-2xl shadow-2xl text-center">
        <h1 class="text-3xl font-bold mb-6 text-green-400">ZIP Directory Tree Maker</h1>
        
        <div class="flex flex-col items-center gap-4">
            <label class="w-full flex flex-col items-center px-4 py-6 bg-gray-800 text-blue rounded-lg shadow-lg tracking-wide uppercase border border-blue cursor-pointer hover:bg-gray-700 transition duration-300">
                <svg class="w-8 h-8" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                    <path d="M16.88 9.1A4 4 0 0 1 16 17H5a5 5 0 0 1-1-9.9V7a3 3 0 0 1 4.52-2.59A4.98 4.98 0 0 1 17 8c0 .38-.04.74-.12 1.1zM11 11h3l-4-4-4 4h3v3h2v-3z" />
                </svg>
                <span class="mt-2 text-base leading-normal">Select a ZIP file</span>
                <input type='file' id="zipFileInput" accept=".zip" class="hidden" />
            </label>
            <p id="fileName" class="text-sm text-gray-400"></p>
        </div>

        <button id="downloadBtn" class="hidden mt-6 px-6 py-2 bg-green-500 hover:bg-green-600 text-white font-bold rounded transition duration-300">
            Download Image
        </button>
    </div>

    <!-- Hidden canvas jahan image draw hogi -->
    <canvas id="treeCanvas" class="hidden mt-8 rounded shadow-2xl"></canvas>

    <script>
        document.getElementById('zipFileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('fileName').innerText = `Selected: ${file.name}`;
            const zip = new JSZip();
            
            try {
                const loadedZip = await zip.loadAsync(file);
                const paths = Object.keys(loadedZip.files);
                
                const tree = buildTree(paths);
                const rawLines = formatTree(tree);
                
                const numberedLines = rawLines.map((line, index) => {
                    const lineNum = String(index + 1).padStart(3, '0');
                    return `${lineNum} | ${line}`;
                });

                drawTreeOnCanvas(numberedLines);
                
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.classList.remove('hidden');
                downloadBtn.onclick = () => downloadCanvasAsImage(file.name);
                
                document.getElementById('treeCanvas').classList.remove('hidden');

            } catch (error) {
                alert("ZIP read karne mein error aayi: " + error.message);
            }
        });

        // Paths ko nested object (tree) mein convert karna
        function buildTree(paths) {
            const tree = {};
            paths.forEach(path => {
                if (!path) return;
                const parts = path.split('/').filter(p => p);
                let current = tree;
                parts.forEach(part => {
                    if (!current[part]) current[part] = {};
                    current = current[part];
                });
            });
            return tree;
        }

        // Tree object ko lines array mein format karna
        function formatTree(tree, prefix = '') {
            let lines = [];
            const entries = Object.keys(tree);
            entries.forEach((key, index) => {
                const isLast = index === entries.length - 1;
                const connector = isLast ? '└── ' : '├── ';
                lines.push(prefix + connector + key);
                
                const extension = isLast ? '    ' : '│   ';
                if (Object.keys(tree[key]).length > 0) {
                    lines = lines.concat(formatTree(tree[key], prefix + extension));
                }
            });
            return lines;
        }

        // Canvas setup aur drawing
        function drawTreeOnCanvas(lines) {
            const canvas = document.getElementById('treeCanvas');
            const ctx = canvas.getContext('2d');

            const fontSize = 16;
            const lineHeight = 24;
            const padding = 30;
            
            ctx.font = `${fontSize}px monospace`;
            
            // Width calculate karna sabse lambi line ke hisaab se
            let maxTextWidth = 0;
            lines.forEach(line => {
                const width = ctx.measureText(line).width;
                if (width > maxTextWidth) maxTextWidth = width;
            });

            canvas.width = maxTextWidth + (padding * 2);
            canvas.height = (lines.length * lineHeight) + (padding * 2);

            // Font dobara set karna padta hai canvas resize ke baad
            ctx.font = `${fontSize}px monospace`;
            ctx.fillStyle = '#1E1E1E'; // Dark background
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Text draw karna (Green text hacker style)
            ctx.fillStyle = '#00FF66';
            
            let yText = padding + fontSize;
            lines.forEach(line => {
                ctx.fillText(line, padding, yText);
                yText += lineHeight;
            });
        }

        // Canvas ko PNG ki tarah save karna
        function downloadCanvasAsImage(originalName) {
            const canvas = document.getElementById('treeCanvas');
            const link = document.createElement('a');
            const outputName = originalName.replace('.zip', '') + '_tree.png';
            
            link.download = outputName;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
