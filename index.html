<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folio · Markdown Preview Links</title>
<meta name="description" content="Turn any raw Markdown link into a beautiful, shareable preview page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#f5f6fb;--surface:#ffffff;--surface2:#f0f2fa;--text:#1b1f33;--muted:#69708f;--border:#e3e6f2;
  --accent:#6a5cf0;--accent2:#12b5d8;--accent-soft:rgba(106,92,240,.1);
  --code-inline:#eceefb;--th:#f1f3fc;--zebra:#fafbff;
  --shadow:0 1px 2px rgba(25,30,70,.05),0 12px 32px rgba(25,30,70,.07);
  --radius:18px;
}
[data-theme=dark]{
  --bg:#0a0c16;--surface:#121528;--surface2:#181c34;--text:#e8ebf8;--muted:#9ba2c6;--border:#242949;
  --accent:#8f82ff;--accent2:#35d0ee;--accent-soft:rgba(143,130,255,.14);
  --code-inline:#1c2140;--th:#181c34;--zebra:#0f1223;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;
  background-image:radial-gradient(900px 420px at 12% -10%,var(--accent-soft),transparent 60%),radial-gradient(800px 380px at 100% 0%,rgba(18,181,216,.08),transparent 60%);
  background-repeat:no-repeat}
button{font-family:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shared chrome ---------- */
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;letter-spacing:-.02em}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(106,92,240,.35)}
.icon-btn{display:inline-flex;align-items:center;gap:8px;height:38px;min-width:38px;padding:0 11px;justify-content:center;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:13.5px;font-weight:600;transition:.15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.icon-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:15px;font-weight:700;cursor:pointer;transition:.18s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent)}
.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--accent),#8a5cf0 55%,var(--accent2));box-shadow:0 10px 26px rgba(106,92,240,.38)}
.btn.primary:hover{color:#fff;box-shadow:0 14px 34px rgba(106,92,240,.5)}
.btn[disabled]{opacity:.6;cursor:progress;transform:none}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
.btn:not(.primary) .spin{border-color:var(--border);border-top-color:var(--accent)}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;z-index:100;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- creator ---------- */
.wrap{max-width:860px;margin:0 auto;padding:22px 20px 70px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:46px}
.hero{text-align:center;margin-bottom:34px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);margin-bottom:18px}
.hero h1{font-size:clamp(2rem,5.4vw,3.3rem);line-height:1.1;letter-spacing:-.035em;margin:0 0 16px;font-weight:800}
.grad{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;max-width:560px;color:var(--muted);font-size:17px;line-height:1.65}
.steps{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:26px 0 0}
.step{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--muted)}
.step b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.label{display:block;font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text)}
.field{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface2);transition:.15s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.field svg{color:var(--muted)}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--text);font:500 15px var(--mono)}
.field input::placeholder{color:var(--muted);font-family:var(--font)}
.hint{margin:10px 2px 0;font-size:13px;color:var(--muted);line-height:1.5}
.err{margin:12px 2px 0;font-size:13.5px;color:#dc2626;font-weight:600;min-height:0}
.row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.row .btn{flex:1;min-width:150px}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.55;background:color-mix(in srgb,#d97706 10%,var(--surface));border:1px solid color-mix(in srgb,#d97706 35%,transparent);color:var(--text)}
.block{margin-top:22px;animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.frame{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.frame-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.dot{width:11px;height:11px;border-radius:50%}
.frame-bar .url{margin-left:10px;flex:1;min-width:0;font:500 12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame-body{max-height:560px;overflow:auto;padding:26px clamp(18px,4vw,38px)}
.frame-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--border);background:var(--surface2)}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.stats b{color:var(--text)}
.result{border-color:color-mix(in srgb,#16a34a 40%,var(--border))}
.result h3{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:10px}
.ok{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#16a34a;color:#fff}
.result p{margin:0 0 16px;color:var(--muted);font-size:14px}
.result .field input{color:var(--accent)}
.row.sm .btn{height:44px;font-size:14px}
.recent{margin-top:34px}
.recent h4{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:10px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{display:block;font:500 12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{margin-top:46px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- viewer ---------- */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:transparent}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .1s}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:64px;padding:0 clamp(14px,3vw,28px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.doc-title{flex:1;min-width:0;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;max-width:1320px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}
.toc{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);overflow:auto;padding:28px 18px 40px 0}
.toc h5{margin:0 0 14px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.toc a{display:block;padding:7px 12px;margin:2px 0;border-radius:10px;font-size:13.5px;line-height:1.4;color:var(--muted);text-decoration:none;font-weight:500;border-left:2px solid transparent;transition:.12s}
.toc a.l3{padding-left:26px;font-size:13px}
.toc a:hover{color:var(--text);background:var(--surface2)}
.toc a.on{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent);font-weight:700}
.content{min-width:0;padding:34px 0 80px clamp(0px,3vw,40px)}
.paper{max-width:860px;margin:0 auto}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border)}
.paper-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:clamp(22px,5vw,56px)}
.source{margin:0;white-space:pre-wrap;word-break:break-word;font:400 13.5px/1.7 var(--mono);color:var(--text)}
.vfoot{max-width:860px;margin:26px auto 0;text-align:center;color:var(--muted);font-size:13px}
.vfoot a{color:var(--accent);text-decoration:none;font-weight:600}
.to-top{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 26px rgba(106,92,240,.4);opacity:0;transform:translateY(14px);pointer-events:none;transition:.22s;z-index:40}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.scrim{display:none}
.only-mobile{display:none}
.skel{height:14px;border-radius:8px;margin:14px 0;background:linear-gradient(90deg,var(--surface2),var(--border),var(--surface2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.fail{text-align:center;padding:50px 20px}
.fail h2{margin:0 0 10px;font-size:22px}
.fail p{color:var(--muted);max-width:480px;margin:0 auto 22px;line-height:1.6}
.fail .row{justify-content:center}.fail .btn{flex:none}

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .content{padding-left:0}
  .only-mobile{display:inline-flex}
  .hide-mobile{display:none}
  .toc{position:fixed;z-index:70;top:0;left:0;bottom:0;width:min(86vw,320px);height:auto;padding:24px 16px;background:var(--surface);
    border-right:1px solid var(--border);transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow)}
  .toc.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(5,8,20,.5);z-index:65;backdrop-filter:blur(2px)}
}

/* ---------- rendered document ---------- */
.doc{font-size:16.5px;line-height:1.78;color:var(--text);overflow-wrap:anywhere}
.doc>:first-child{margin-top:0}
.doc [align=center]{text-align:center}
.doc h1,.doc h2,.doc h3,.doc h4{position:relative;scroll-margin-top:86px;line-height:1.25;letter-spacing:-.015em}
.doc h1{font-size:clamp(1.9rem,4.4vw,2.6rem);font-weight:800;margin:1em 0 .5em;letter-spacing:-.03em}
.doc h2{font-size:1.7rem;font-weight:800;margin:2.3em 0 .75em;padding-bottom:.4em;border-bottom:1px solid var(--border)}
.doc h3{font-size:1.28rem;font-weight:750;margin:1.9em 0 .55em}
.doc h4{font-size:1.08rem;font-weight:700;margin:1.6em 0 .5em}
.doc .anchor{position:absolute;left:-1.15em;top:0;opacity:0;color:var(--accent);text-decoration:none;font-weight:600;border:0;transition:.15s}
.doc :is(h1,h2,h3,h4):hover .anchor{opacity:1}
.doc p{margin:1em 0}
.doc a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);transition:.15s}
.doc a:hover{border-bottom-color:var(--accent)}
.doc strong{font-weight:700}
.doc :not(pre)>code{font-family:var(--mono);font-size:.86em;background:var(--code-inline);padding:.18em .5em;border-radius:7px;border:1px solid var(--border)}
.doc ul,.doc ol{padding-left:1.5em;margin:1em 0}
.doc li{margin:.4em 0}
.doc li::marker{color:var(--accent);font-weight:700}
.doc li>ul,.doc li>ol{margin:.3em 0}
.doc input[type=checkbox]{accent-color:var(--accent);margin-right:8px;transform:scale(1.15)}
.doc hr{border:0;height:1px;margin:2.6em 0;background:linear-gradient(90deg,transparent,var(--border) 20%,var(--border) 80%,transparent)}
.doc img{max-width:100%;height:auto;border-radius:10px;vertical-align:middle}
.doc img.broken{display:none}
.doc details{margin:1.2em 0;padding:12px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface2)}
.doc summary{cursor:pointer;font-weight:700}
.doc .table-wrap{overflow:auto;margin:1.4em 0;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-size:.94em}
.doc th{background:var(--th);text-align:left;font-weight:700;white-space:nowrap}
.doc th,.doc td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:top}
.doc tr:last-child td{border-bottom:0}
.doc tbody tr:nth-child(even){background:var(--zebra)}
.doc .codeblock{margin:1.4em 0;border-radius:14px;overflow:hidden;background:#0d1117;border:1px solid #252c48;box-shadow:0 8px 24px rgba(5,8,25,.25)}
.doc .codehead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 16px;background:#151a2e;color:#8f9ac0;font:600 11.5px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.doc .copy{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid #2a3150;background:transparent;color:#aab3d6;font:600 11.5px var(--font);cursor:pointer;text-transform:none;letter-spacing:0}
.doc .copy:hover{background:#1e2440;color:#fff}
.doc .codeblock pre{margin:0;padding:16px 18px;overflow:auto}
.doc .codeblock code{font-family:var(--mono);font-size:13.5px;line-height:1.7;background:none;padding:0;border:0;color:#e6edf3}
.doc .callout{--c:var(--accent);margin:1.5em 0;padding:16px 20px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 28%,transparent);border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.doc .callout.tip{--c:#16a34a}.doc .callout.warning{--c:#d97706}.doc .callout.danger{--c:#dc2626}.doc .callout.important{--c:#7c3aed}.doc .callout.note{--c:#2563eb}
.doc .callout>:first-child{margin-top:0}.doc .callout>:last-child{margin-bottom:0}
.doc .callout-title{display:block;font-weight:800;color:var(--c);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}

@media print{
  .topbar,.toc,.progress,.to-top,.toast,.meta,.vfoot,.scrim,.copy{display:none!important}
  body{background:#fff;color:#000}
  .shell{display:block;padding:0}.content{padding:0}
  .paper-card{box-shadow:none;border:0;padding:0}
  .doc .codeblock{break-inside:avoid}
}
</style>
</head>

  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  spark: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>'
};
function icon(n) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n] + '</svg>'; }

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); store('folio-theme', t); }
function initTheme() {
  var t = store('folio-theme');
  if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
}
function themeIcon() { return document.documentElement.getAttribute('data-theme') === 'dark' ? icon('sun') : icon('moon'); }
function bindTheme(btn) {
  btn.innerHTML = themeIcon();
  btn.addEventListener('click', function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    btn.innerHTML = themeIcon();
  });
}

function enc(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function dec(s) { return decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))); }
/* Where this page lives on your site. Used when Folio is opened from a temporary blob: or file: address. */
var HOSTED_PATH = '/md/';
function isWeb() { return /^https?:$/.test(location.protocol); }
function baseUrl() {
  if (isWeb()) return location.href.split(/[?#]/)[0];
  var saved = store('folio-base');
  if (saved) return saved.trim();
  if (location.protocol === 'blob:' && /^https?:/.test(location.origin)) return location.origin + HOSTED_PATH;
  return '';
}

var toastTimer;
function toast(msg) {
  var t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1900);
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* ---------------- url + fetch ---------------- */
function normalizeUrl(input) {
  var u;
  try { u = new URL(String(input).trim()); } catch (e) { throw new Error('That does not look like a valid link. Paste the full raw file URL.'); }
  if (!/^https?:$/.test(u.protocol)) throw new Error('Only http and https links are supported.');
  if (u.hostname === 'github.com') {
    var m = u.pathname.match(/^\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/);
    if (m) return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3];
  }
  return u.toString();
}
function fetchText(url) {
  return fetch(url, { cache: 'no-store' }).then(function (res) {
    if (!res.ok) throw new Error('The server answered with status ' + res.status + '. Check that the file is public and the link is correct.');
    return res.text();
  }, function () {
    throw new Error('Could not load the file. The link may be private, or the host blocks cross-site requests. GitHub raw links work best.');
  }).then(function (text) {
    if (text.length > 2000000) throw new Error('This file is larger than 2 MB, which is too big to preview.');
    return text;
  });
}

/* ---------------- markdown rendering ---------------- */
function slug(t) { return t.toLowerCase().trim().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-'); }
function norm(s) { return s.toLowerCase().replace(/[^\p{L}\p{N}-]/gu, ''); }

function render(md, base) {
  var raw = marked.parse(md, { gfm: true });
  var clean = DOMPurify.sanitize(raw, { ADD_ATTR: ['align', 'target', 'open'], ADD_TAGS: ['details', 'summary'] });
  var root = document.createElement('div');
  root.innerHTML = clean;

  var headings = [], used = {};
  root.querySelectorAll('h1,h2,h3,h4').forEach(function (h) {
    var text = h.textContent.trim();
    var id = slug(text), n = used[id] || 0;
    used[id] = n + 1;
    if (n) id += '-' + n;
    h.id = id;
    var a = document.createElement('a');
    a.className = 'anchor'; a.href = '#' + id; a.textContent = '#'; a.setAttribute('aria-label', 'Link to this section');
    h.appendChild(a);
    headings.push({ id: id, level: +h.tagName.charAt(1), text: text });
  });

  root.querySelectorAll('a[href]').forEach(function (a) {
    var h = a.getAttribute('href');
    if (h.charAt(0) === '#' || a.classList.contains('anchor')) return;
    try {
      var abs = new URL(h, base);
      if (/^https?:$/.test(abs.protocol)) { a.href = abs.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    } catch (e) { /* leave as is */ }
  });
  root.querySelectorAll('img[src]').forEach(function (img) {
    try { img.src = new URL(img.getAttribute('src'), base).href; } catch (e) { /* ignore */ }
    img.loading = 'lazy';
  });

  root.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div'); w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });

  root.querySelectorAll('pre > code').forEach(function (code) {
    var pre = code.parentElement;
    var m = (code.className.match(/language-([\w+-]+)/) || [])[1];
    var lang = m || 'text';
    try { if (m && window.hljs && hljs.getLanguage(m)) hljs.highlightElement(code); } catch (e) { /* plain */ }
    var box = document.createElement('div'); box.className = 'codeblock';
    var head = document.createElement('div'); head.className = 'codehead';
    var l = document.createElement('span'); l.textContent = lang;
    var b = document.createElement('button'); b.className = 'copy'; b.type = 'button'; b.setAttribute('data-copy-code', '1');
    b.innerHTML = icon('copy') + '<span>Copy</span>';
    head.appendChild(l); head.appendChild(b);
    pre.parentNode.insertBefore(box, pre);
    box.appendChild(head); box.appendChild(pre);
  });

  var TYPES = { note: 'Note', tip: 'Tip', important: 'Important', warning: 'Warning', caution: 'Danger', danger: 'Danger' };
  root.querySelectorAll('blockquote').forEach(function (q) {
    var type = 'note', first = q.querySelector('p');
    var txt = q.textContent.trim();
    var alert = txt.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);
    if (alert) {
      type = alert[1].toLowerCase();
      if (first) first.innerHTML = first.innerHTML.replace(/^\s*\[!\w+\]\s*(<br\s*\/?>)?\s*/i, '');
    } else {
      var s = q.querySelector('strong');
      var lead = s ? s.textContent.toLowerCase() : '';
      if (/confidential|warning|careful|never|must not/.test(lead)) type = 'warning';
      else if (/danger|critical|caution/.test(lead)) type = 'danger';
      else if (/tip|hint|pro/.test(lead)) type = 'tip';
      else if (/important|key|contract/.test(lead)) type = 'important';
    }
    q.classList.add('callout', type === 'caution' ? 'danger' : type);
    var title = document.createElement('span');
    title.className = 'callout-title'; title.textContent = TYPES[type] || 'Note';
    q.insertBefore(title, q.firstChild);
  });

  var h1 = root.querySelector('h1');
  var words = (md.trim().match(/\S+/g) || []).length;
  return {
    html: root.innerHTML,
    title: h1 ? h1.textContent.replace(/#$/, '').trim() : 'Untitled document',
    headings: headings,
    words: words,
    minutes: Math.max(1, Math.round(words / 220))
  };
}

function afterInsert(container) {
  container.querySelectorAll('img').forEach(function (i) { i.addEventListener('error', function () { i.classList.add('broken'); }); });
}
function findHeading(scope, hash) {
  var want = norm(hash), found = null;
  scope.querySelectorAll('h1,h2,h3,h4').forEach(function (h) { if (!found && norm(h.id) === want) found = h; });
  return found;
}
function wireDocClicks(container) {
  container.addEventListener('click', function (e) {
    var cb = e.target.closest('[data-copy-code]');
    if (cb) {
      var code = cb.closest('.codeblock').querySelector('code');
      copyText(code.textContent).then(function (ok) {
        var s = cb.querySelector('span');
        s.textContent = ok ? 'Copied' : 'Failed';
        setTimeout(function () { s.textContent = 'Copy'; }, 1500);
      });
      return;
    }
    var a = e.target.closest('a[href^="#"]');
    if (a) {
      var target = findHeading(container, decodeURIComponent(a.getAttribute('href').slice(1)));
      if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
}

/* ---------------- viewer ---------------- */
function mountViewer(url) {
  document.body.innerHTML =
    '<div class="progress"><i id="bar"></i></div>' +
    '<header class="topbar">' +
      '<button class="icon-btn only-mobile" id="btnToc" title="Contents" aria-label="Contents">' + icon('list') + '</button>' +
      '<a class="brand" href="' + baseUrl() + '"><span class="logo">F</span><span class="hide-mobile">Folio</span></a>' +
      '<div class="doc-title" id="docTitle">Loading…</div>' +
      '<div class="actions">' +
        '<button class="icon-btn" id="btnView" title="Toggle source">' + icon('code') + '<span class="hide-mobile">Source</span></button>' +
        '<button class="icon-btn" id="btnCopy" title="Copy Markdown">' + icon('copy') + '<span class="hide-mobile">Copy</span></button>' +
        '<button class="icon-btn hide-mobile" id="btnDl" title="Download .md">' + icon('download') + '</button>' +
        '<button class="icon-btn hide-mobile" id="btnPrint" title="Print or save as PDF">' + icon('printer') + '</button>' +
        '<button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme"></button>' +
      '</div>' +
    '</header>' +
    '<div class="shell">' +
      '<aside class="toc" id="toc"></aside>' +
      '<main class="content"><div class="paper">' +
        '<div class="meta" id="meta"></div>' +
        '<div class="paper-card"><article class="doc" id="article"><div class="skel" style="width:60%;height:28px"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:80%"></div></article>' +
        '<pre class="source" id="source" hidden></pre></div>' +
        '<div class="vfoot" id="vfoot"></div>' +
      '</div></main>' +
    '</div>' +
    '<div class="scrim" id="scrim"></div>' +
    '<button class="to-top" id="toTop" aria-label="Back to top">' + icon('up') + '</button>' +
    '<div class="toast" id="toast"></div>';

  bindTheme($('#btnTheme'));
  var article = $('#article');
  var data = null, md = '';

  fetchText(url).then(function (text) {
    md = text;
    data = render(md, url);
    article.innerHTML = data.html;
    afterInsert(article);
    wireDocClicks(article);
    document.title = data.title + ' · Folio';
    $('#docTitle').textContent = data.title;
    $('#source').textContent = md;

    var host = '';
    try { host = new URL(url).hostname; } catch (e) { host = ''; }
    $('#meta').innerHTML =
      '<span class="chip">' + icon('eye') + data.minutes + ' min read</span>' +
      '<span class="chip">' + icon('spark') + data.words.toLocaleString() + ' words</span>' +
      '<span class="chip">' + icon('list') + data.headings.length + ' sections</span>';
    var vf = $('#vfoot');
    vf.innerHTML = 'Rendered by <a href="' + baseUrl() + '">Folio</a> from ';
    var src = document.createElement('a'); src.href = url; src.target = '_blank'; src.rel = 'noopener noreferrer'; src.textContent = host || 'source';
    vf.appendChild(src);

    buildToc(data.headings);
  }).catch(function (err) {
    $('#docTitle').textContent = 'Could not load';
    article.innerHTML = '';
    var box = document.createElement('div'); box.className = 'fail';
    var h = document.createElement('h2'); h.textContent = 'This preview could not be loaded';
    var p = document.createElement('p'); p.textContent = err.message;
    var row = document.createElement('div'); row.className = 'row';
    var retry = document.createElement('button'); retry.className = 'btn primary'; retry.textContent = 'Try again';
    retry.onclick = function () { location.reload(); };
    var mk = document.createElement('a'); mk.className = 'btn'; mk.href = baseUrl(); mk.textContent = 'Create your own link';
    mk.style.textDecoration = 'none';
    row.appendChild(retry); row.appendChild(mk);
    box.appendChild(h); box.appendChild(p); box.appendChild(row);
    article.appendChild(box);
  });

  function buildToc(headings) {
    var toc = $('#toc');
    var items = headings.filter(function (h) { return h.level === 2 || h.level === 3; });
    if (!items.length) items = headings.filter(function (h) { return h.level <= 3; });
    if (!items.length) { toc.style.display = 'none'; document.querySelector('.shell').style.gridTemplateColumns = 'minmax(0,1fr)'; return; }
    var title = document.createElement('h5'); title.textContent = 'On this page';
    toc.appendChild(title);
    var links = {};
    items.forEach(function (h) {
      var a = document.createElement('a');
      a.href = '#' + h.id; a.textContent = h.text; if (h.level >= 3) a.className = 'l3';
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var el = document.getElementById(h.id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        closeToc();
      });
      toc.appendChild(a); links[h.id] = a;
    });
    if ('IntersectionObserver' in window) {
      var current = null;
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting && links[en.target.id]) {
            if (current) current.classList.remove('on');
            current = links[en.target.id]; current.classList.add('on');
            if (window.innerWidth > 980) current.scrollIntoView({ block: 'nearest' });
          }
        });
      }, { rootMargin: '-84px 0px -72% 0px', threshold: 0 });
      items.forEach(function (h) { var el = document.getElementById(h.id); if (el) io.observe(el); });
    }
  }

  function openToc() { $('#toc').classList.add('open'); $('#scrim').classList.add('show'); }
  function closeToc() { $('#toc').classList.remove('open'); $('#scrim').classList.remove('show'); }
  $('#btnToc').addEventListener('click', openToc);
  $('#scrim').addEventListener('click', closeToc);

  $('#btnView').addEventListener('click', function () {
    var src = $('#source'), showing = !src.hidden;
    src.hidden = showing; article.hidden = !showing;
    this.classList.toggle('active', !showing);
    window.scrollTo({ top: 0 });
  });
  $('#btnCopy').addEventListener('click', function () {
    copyText(md).then(function (ok) { toast(ok ? 'Markdown copied' : 'Copy failed'); });
  });
  $('#btnDl').addEventListener('click', function () {
    var name = (url.split('/').pop().split('?')[0] || 'document.md');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
    a.download = /\.(md|markdown|txt)$/i.test(name) ? name : name + '.md';
    document.body.appendChild(a); a.click(); a.remove();
  });
  $('#btnPrint').addEventListener('click', function () { window.print(); });

  var bar = $('#bar'), top = $('#toTop');
  $('#toTop').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  function onScroll() {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    top.classList.toggle('show', h.scrollTop > 600);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* ---------------- creator ---------------- */
function mountCreator() {
  document.body.innerHTML =
    '<div class="wrap">' +
      '<nav class="nav"><a class="brand" href="' + baseUrl() + '"><span class="logo">F</span><span>Folio</span></a>' +
      '<button class="icon-btn" id="btnTheme" aria-label="Toggle theme"></button></nav>' +
      '<section class="hero">' +
        '<span class="pill">' + icon('spark') + 'Markdown to beautiful shareable pages</span>' +
        '<h1>Turn any raw link into a <span class="grad">stunning preview</span></h1>' +
        '<p>Paste the raw URL of a Markdown file. Review it first, then create one clean link that anyone can open and read.</p>' +
        '<div class="steps"><span class="step"><b>1</b>Paste raw URL</span><span class="step"><b>2</b>Preview it</span><span class="step"><b>3</b>Create and share</span></div>' +
      '</section>' +
      '<section class="card">' +
        '<label class="label" for="url">Raw file URL</label>' +
        '<div class="field">' + icon('link') + '<input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://raw.githubusercontent.com/user/repo/main/README.md"></div>' +
        '<p class="hint">GitHub file links are converted to raw automatically. The file must be public.</p>' +
        '<div class="err" id="err" role="alert"></div>' +
        '<div class="row"><button class="btn" id="btnPreview">' + icon('eye') + 'Preview</button><button class="btn primary" id="btnCreate">' + icon('spark') + 'Create link</button></div>' +
        (isWeb() ? '' : '<div class="notice" id="baseNotice"></div>') +
      '</section>' +
      '<section id="previewBox" class="block" hidden></section>' +
      '<section id="result" class="block" hidden></section>' +
      '<section id="recent" class="recent" hidden></section>' +
      '<div class="foot">Folio renders in your browser. Nothing is uploaded or stored on a server.</div>' +
    '</div><div class="toast" id="toast"></div>';

  bindTheme($('#btnTheme'));
  var input = $('#url'), err = $('#err'), btnP = $('#btnPreview'), btnC = $('#btnCreate');
  var cache = null;

  var notice = $('#baseNotice');
  if (notice) {
    var derived = baseUrl();
    if (derived) {
      notice.textContent = 'This is a temporary preview page, so created links will point to ' + derived + ' instead. Make sure Folio is uploaded at that address.';
    } else {
      notice.innerHTML = 'You opened this file from your device. Enter the web address where Folio is hosted, so the links work for everyone.' +
        '<div class="field" style="margin-top:10px;height:46px"><input id="baseInput" type="url" placeholder="https://your-site.pages.dev/md/"></div>';
      var bi = $('#baseInput');
      bi.value = store('folio-base') || '';
      bi.addEventListener('input', function () { store('folio-base', bi.value.trim()); });
    }
  }

  function showErr(m) { err.textContent = m; }
  function busy(btn, on) {
    btnP.disabled = btnC.disabled = on;
    if (on) { btn.dataset.html = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>Loading…'; }
    else { btnP.innerHTML = icon('eye') + 'Preview'; btnC.innerHTML = icon('spark') + 'Create link'; }
  }
  function load(btn) {
    showErr('');
    var url;
    try { url = normalizeUrl(input.value); } catch (e) { showErr(e.message); return Promise.resolve(null); }
    if (cache && cache.url === url) return Promise.resolve(cache);
    busy(btn, true);
    return fetchText(url).then(function (md) {
      var r = render(md, url);
      cache = { url: url, md: md, r: r };
      return cache;
    }).catch(function (e) { showErr(e.message); return null; })
      .then(function (c) { busy(btn, false); return c; });
  }

  function showPreview(c) {
    var box = $('#previewBox');
    box.hidden = false; box.innerHTML = '';
    var frame = document.createElement('div'); frame.className = 'frame';
    frame.innerHTML =
      '<div class="frame-bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i><span class="url"></span></div>' +
      '<div class="frame-body"><div class="doc" id="pdoc"></div></div>' +
      '<div class="frame-foot"><div class="stats"></div><button class="btn primary" id="btnLooks" style="height:44px">' + icon('check') + 'Looks good, create link</button></div>';
    box.appendChild(frame);
    frame.querySelector('.url').textContent = c.url;
    var doc = frame.querySelector('#pdoc');
    doc.innerHTML = c.r.html; afterInsert(doc); wireDocClicks(doc);
    var st = frame.querySelector('.stats');
    st.innerHTML = '<span><b></b></span><span><b>' + c.r.words.toLocaleString() + '</b> words</span><span><b>' + c.r.headings.length + '</b> sections</span><span><b>' + c.r.minutes + '</b> min read</span>';
    st.querySelector('b').textContent = c.r.title;
    frame.querySelector('#btnLooks').addEventListener('click', function () { makeLink(c); });
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function makeLink(c) {
    var b = baseUrl();
    if (!b) { showErr('Enter the web address where Folio is hosted (see the notice below the buttons).'); return; }
    var link = b + '?v=' + enc(c.url);
    var box = $('#result');
    box.hidden = false;
    box.innerHTML =
      '<div class="card result"><h3><span class="ok">' + icon('check') + '</span>Your link is ready</h3>' +
      '<p>Anyone who opens it will see the formatted document, always up to date with the source file.</p>' +
      '<div class="field">' + icon('link') + '<input id="outLink" readonly></div>' +
      '<div class="row sm"><button class="btn primary" id="oCopy">' + icon('copy') + 'Copy link</button>' +
      '<button class="btn" id="oOpen">' + icon('ext') + 'Open</button>' +
      (navigator.share ? '<button class="btn" id="oShare">' + icon('share') + 'Share</button>' : '') + '</div></div>';
    var out = $('#outLink'); out.value = link;
    out.addEventListener('focus', function () { out.select(); });
    $('#oCopy').addEventListener('click', function () { copyText(link).then(function (ok) { toast(ok ? 'Link copied' : 'Copy failed'); }); });
    $('#oOpen').addEventListener('click', function () { window.open(link, '_blank', 'noopener'); });
    var sh = $('#oShare');
    if (sh) sh.addEventListener('click', function () { navigator.share({ title: c.r.title, url: link }).catch(function () {}); });
    saveRecent({ title: c.r.title, url: c.url, link: link, t: Date.now() });
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function getRecent() { try { return JSON.parse(store('folio-recent') || '[]'); } catch (e) { return []; } }
  function saveRecent(item) {
    var list = getRecent().filter(function (x) { return x.url !== item.url; });
    list.unshift(item);
    store('folio-recent', JSON.stringify(list.slice(0, 8)));
    renderRecent();
  }
  function renderRecent() {
    var list = getRecent(), box = $('#recent');
    if (!list.length) { box.hidden = true; return; }
    box.hidden = false; box.innerHTML = '';
    var h = document.createElement('h4'); h.textContent = 'Recent links'; box.appendChild(h);
    list.forEach(function (it) {
      var row = document.createElement('div'); row.className = 'item';
      var t = document.createElement('div'); t.className = 't';
      var b = document.createElement('b'); b.textContent = it.title;
      var s = document.createElement('span'); s.textContent = it.url;
      t.appendChild(b); t.appendChild(s);
      var c = document.createElement('button'); c.className = 'icon-btn'; c.title = 'Copy link'; c.innerHTML = icon('copy');
      c.addEventListener('click', function () { copyText(it.link).then(function (ok) { toast(ok ? 'Link copied' : 'Copy failed'); }); });
      var o = document.createElement('button'); o.className = 'icon-btn'; o.title = 'Open'; o.innerHTML = icon('ext');
      o.addEventListener('click', function () { window.open(it.link, '_blank', 'noopener'); });
      row.appendChild(t); row.appendChild(c); row.appendChild(o); box.appendChild(row);
    });
  }

  btnP.addEventListener('click', function () { load(btnP).then(function (c) { if (c) showPreview(c); }); });
  btnC.addEventListener('click', function () { load(btnC).then(function (c) { if (c) makeLink(c); }); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') btnP.click(); });
  input.addEventListener('input', function () { showErr(''); });
  renderRecent();
}

/* ---------------- boot ---------------- */
initTheme();
var v = new URLSearchParams(location.search).get('v');
var target = null;
if (v) { try { target = normalizeUrl(dec(v)); } catch (e) { target = null; } }
if (target) mountViewer(target); else mountCreator();
})();
</script>
